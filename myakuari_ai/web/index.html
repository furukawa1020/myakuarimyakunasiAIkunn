  <!-- ================================================================
       Web Speech API Bridge
       FlutterのネイティブプラグインなしでブラウザのSpeech APIを使用。
       window.startVoiceRecognition() / window.getVoiceResult() でアクセス。
       ================================================================ -->
  <script>
    window._voiceResult = undefined;
    window._voiceRecording = false;

    window.startVoiceRecognition = function(timeoutMs) {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { window._voiceResult = ''; return; }

      var recognition = new SR();
      recognition.lang = 'ja-JP';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.continuous = false;

      window._voiceResult = undefined;
      window._voiceRecording = true;

      recognition.onresult = function(e) {
        window._voiceResult = e.results[0][0].transcript;
        window._voiceRecording = false;
      };
      recognition.onerror = function(e) {
        console.warn('Voice error:', e.error);
        window._voiceResult = '';
        window._voiceRecording = false;
      };
      recognition.onend = function() {
        if (window._voiceResult === undefined) window._voiceResult = '';
        window._voiceRecording = false;
      };

      try { recognition.start(); }
      catch(e) { window._voiceResult = ''; window._voiceRecording = false; }

      setTimeout(function() {
        if (window._voiceResult === undefined) {
          try { recognition.stop(); } catch(_) {}
          window._voiceResult = '';
        }
      }, timeoutMs || 8000);
    };

    window.getVoiceResult = function() { return window._voiceResult; };
    window.isVoiceRecording = function() { return window._voiceRecording; };
  </script>
  <script src="flutter_bootstrap.js" async></script>
