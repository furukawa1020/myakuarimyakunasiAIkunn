  <!-- ================================================================
       Real Audio Bridge
       Web Audio API (AnalyserNode) + Web Speech API (interim results)
       
       Flutter から呼び出せる関数:
         window.startAudioScan(timeoutMs)  → マイク取得・計測開始
         window.stopAudioScan()            → 停止
         window.getAudioState()           → JSON文字列で状態を返す
           {
             recording: bool,
             transcript: string,       // 確定済みテキスト
             interimTranscript: string, // 認識中テキスト（リアルタイム）
             rms: number,              // 音量 0-100
             jitter: number,           // 声の揺れ(ZCR) 0-100
             dominantFreqHz: number,   // 主要周波数 Hz
             spectrum: number[]        // FFTデータ 16バンド 0-255
           }
       ================================================================ -->
  <script>
    (function() {
      'use strict';

      // ── 状態 ──────────────────────────────────────────────────
      var state = {
        recording:          false,
        transcript:         '',
        interimTranscript:  '',
        rms:                0,
        jitter:             0,
        dominantFreqHz:     0,
        spectrum:           new Array(16).fill(0),
        supported:          !!(window.SpeechRecognition || window.webkitSpeechRecognition),
        speechError:        '',
      };

      var _audioCtx        = null;
      var _analyser        = null;
      var _stream          = null;
      var _recognition     = null;
      var _metricsTimer    = null;

      // ── Web Audio API セットアップ ─────────────────────────────
      async function _startAudio() {
        try {
          _stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          var source = _audioCtx.createMediaStreamSource(_stream);
          _analyser = _audioCtx.createAnalyser();
          _analyser.fftSize = 256;           // 128バンド (我々は先頭16バンドを使う)
          _analyser.smoothingTimeConstant = 0.8;
          source.connect(_analyser);
          _startMetricsLoop();
        } catch (e) {
          console.warn('[AudioScan] getUserMedia failed:', e);
        }
      }

      // ── リアルタイム音声メトリクス計測ループ ─────────────────
      function _startMetricsLoop() {
        var freqData  = new Uint8Array(_analyser.frequencyBinCount);  // 128要素
        var timeData  = new Float32Array(_analyser.fftSize);           // 256要素

        _metricsTimer = setInterval(function() {
          if (!_analyser) return;

          // 周波数ドメインデータ (FFT)
          _analyser.getByteFrequencyData(freqData);

          // 先頭16バンドを抽出 (低周波〜中周波)
          var spectrum16 = [];
          var bandSize = Math.floor(freqData.length / 16);
          for (var b = 0; b < 16; b++) {
            var sum = 0;
            for (var k = 0; k < bandSize; k++) sum += freqData[b * bandSize + k];
            spectrum16.push(Math.round(sum / bandSize));
          }

          // RMS (音量)
          var sumSq = 0;
          for (var i = 0; i < freqData.length; i++) sumSq += freqData[i] * freqData[i];
          var rms = Math.sqrt(sumSq / freqData.length);

          // 主要周波数 (Hz)
          var maxIdx = 0;
          for (var i = 1; i < freqData.length; i++) {
            if (freqData[i] > freqData[maxIdx]) maxIdx = i;
          }
          var domFreq = Math.round(maxIdx * _audioCtx.sampleRate / _analyser.fftSize);

          // ゼロ交差率 (声の揺れ/Jitter の代理指標) — 時間ドメイン
          _analyser.getFloatTimeDomainData(timeData);
          var zcr = 0;
          for (var i = 1; i < timeData.length; i++) {
            if ((timeData[i] >= 0) !== (timeData[i - 1] >= 0)) zcr++;
          }
          var normalizedZcr = Math.round((zcr / timeData.length) * 100);

          // 状態更新
          state.rms            = Math.round(rms);
          state.jitter         = normalizedZcr;
          state.dominantFreqHz = domFreq;
          state.spectrum       = spectrum16;

        }, 80); // 80ms = ~12fps のリアルタイム更新
      }

      // ── Web Speech API セットアップ ────────────────────────────
      var _srRestartTimer = null;
      var _watchdogTimer  = null;

      function _createRecognition() {
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          console.warn('[AudioScan] SpeechRecognition not supported in this browser');
          state.supported = false;
          state.speechError = 'not-supported';
          return;
        }

        // 既存インスタンスを確実に破棄
        if (_recognition) {
          try { _recognition.abort(); } catch(_) {}
          _recognition = null;
        }

        var rec = new SR();
        rec.lang            = 'ja-JP';
        rec.interimResults  = true;
        rec.maxAlternatives = 1;
        rec.continuous      = false; // false の方が安定して再起動できる

        rec.onstart = function() {
          console.log('[AudioScan] SpeechRecognition started OK');
          state.speechError = '';
        };

        rec.onresult = function(event) {
          var interim = '';
          var finalText = '';
          for (var i = event.resultIndex; i < event.results.length; i++) {
            var text = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalText += text;
            } else {
              interim += text;
            }
          }
          if (finalText)  state.transcript       += finalText;
          state.interimTranscript = interim;
          console.log('[AudioScan] result final="' + finalText + '" interim="' + interim + '"');
        };

        rec.onerror = function(e) {
          console.warn('[AudioScan] Speech error:', e.error);
          state.speechError = e.error || 'unknown';
          // aborted は正常停止なので無視
          if (e.error === 'aborted') return;
          // その他エラーは少し待って再起動
          if (state.recording) {
            clearTimeout(_srRestartTimer);
            _srRestartTimer = setTimeout(_createRecognition, 300);
          }
        };

        rec.onend = function() {
          console.log('[AudioScan] SpeechRecognition ended. recording=' + state.recording);
          state.interimTranscript = '';
          if (state.recording) {
            clearTimeout(_srRestartTimer);
            _srRestartTimer = setTimeout(_createRecognition, 200);
          }
        };

        _recognition = rec;
        try {
          rec.start();
        } catch(e) {
          console.warn('[AudioScan] start() threw:', e);
          state.speechError = 'start-failed';
          if (state.recording) {
            clearTimeout(_srRestartTimer);
            _srRestartTimer = setTimeout(_createRecognition, 500);
          }
        }
      }

      function _startSpeech(timeoutMs) {
        _createRecognition();

        // ウォッチドッグ: 2秒ごとに生存確認（万が一 onend が来なかった場合の保険）
        _watchdogTimer = setInterval(function() {
          if (!state.recording) {
            clearInterval(_watchdogTimer);
            return;
          }
          // _recognition が null になっていたら再起動
          if (!_recognition) {
            console.warn('[AudioScan] Watchdog: recognition is null, restarting...');
            _createRecognition();
          }
        }, 2000);

        // タイムアウト（デフォルト 1時間 = 事実上なし）
        setTimeout(function() { window.stopAudioScan(); }, timeoutMs || 3600000);
      }

      // ── 公開API ──────────────────────────────────────────────
      window.startAudioScan = function(timeoutMs) {
        if (state.recording) return;
        state.recording         = true;
        state.transcript        = '';
        state.interimTranscript = '';

        // ★ SpeechRecognition を最初に起動（マイクを先に確保させる）
        _startSpeech(timeoutMs);

        // ★ 音量可視化は後から非同期で試みる（失敗しても文字起こしには影響しない）
        setTimeout(function() {
          _startAudio().catch(function(e) {
            console.warn('[AudioScan] Audio visualization unavailable:', e);
          });
        }, 500);
      };

      window.stopAudioScan = function() {
        state.recording = false;
        clearInterval(_metricsTimer);  _metricsTimer  = null;
        clearInterval(_watchdogTimer); _watchdogTimer = null;
        clearTimeout(_srRestartTimer); _srRestartTimer = null;
        if (_recognition) { try { _recognition.abort(); } catch(_) {} _recognition = null; }
        if (_stream)      { _stream.getTracks().forEach(function(t) { t.stop(); }); _stream = null; }
        if (_audioCtx)    { _audioCtx.close(); _audioCtx = null; }
        _analyser = null;
      };

      window.getAudioState = function() {
        return JSON.stringify({
          recording:          state.recording,
          transcript:         state.transcript,
          interimTranscript:  state.interimTranscript,
          rms:                state.rms,
          jitter:             state.jitter,
          dominantFreqHz:     state.dominantFreqHz,
          spectrum:           state.spectrum,
          supported:          state.supported,
          speechError:        state.speechError,
        });
      };

      // Legacy compat
      window.startVoiceRecognition = function(ms) { window.startAudioScan(ms); };
      window.getVoiceResult = function() { return state.transcript || (state.recording ? undefined : ''); };
      window.openInNewTab = function(url) { window.open(url, '_blank'); };

    })();
  </script>
